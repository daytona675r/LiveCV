<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">LiveCV — One career, multiple perspectives</title>
<desc id="desc">An illustrative diagram of one shared career data source rendered into role-specific CV views and a three-page PDF. No fictional career facts are shown.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1626"/><stop offset=".62" stop-color="#17263b"/><stop offset="1" stop-color="#101f37"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7aa9fa"/><stop offset="1" stop-color="#68d7ea"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1e334d"/><stop offset="1" stop-color="#132235"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#7191c4" fill="none" stroke-width=".7" opacity=".13"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="35"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#030711" flood-opacity=".55"/></filter>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>
<rect width="1280" height="640" fill="url(#grid)"/>
<ellipse cx="1100" cy="100" rx="260" ry="145" fill="#3767bd" opacity=".28" filter="url(#glow)"/>
<path d="M0 596Q250 541 520 588T1280 546" fill="none" stroke="#528bbf" stroke-width="1.5" opacity=".4"/>
<path d="M70 117h100" stroke="#76b3ff" stroke-width="6" stroke-linecap="round"/>
<text x="70" y="201" font-family="Arial, Helvetica, sans-serif" font-size="91" font-weight="700" fill="#f5f8ff">Live<tspan fill="url(#accent)">CV</tspan></text>
<text x="70" y="295" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#f4f8ff">One career,</text>
<text x="70" y="345" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#97bfff">multiple perspectives.</text>
<text x="72" y="394" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bbcbdf">A shared career data model powering tailored</text>
<text x="72" y="425" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bbcbdf">React views and printable A4 PDFs.</text>
